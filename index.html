<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sax Setlist</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#fff;padding:17px 16px 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;color:#777}main{max-width:720px;margin:auto;padding:14px 14px 88px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
button{border:0;border-radius:10px;padding:10px 13px;font-size:14px;background:#222;color:#fff}
button.secondary{background:#e9e9ec;color:#222}button.danger{background:#fff0f0;color:#c22}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#777;font-size:13px}
label{display:block;font-size:12px;color:#666;margin:9px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:16px;background:#fff}
.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.title{font-weight:600}.time{font-variant-numeric:tabular-nums;color:#555}.grab{font-size:20px;color:#999;padding-right:8px;cursor:grab}
.gap{margin:6px 0 2px 30px;padding:8px 10px;background:#f2f2f4;border-radius:9px;font-size:13px}
.total{font-size:20px;font-weight:700}.end{font-size:14px;color:#555}
.empty{text-align:center;color:#888;padding:28px 8px}.hidden{display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:9px;display:flex;gap:8px;z-index:10}.bottom button{flex:1}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}
.badge{font-size:11px;background:#eee;padding:3px 7px;border-radius:99px;margin-left:5px}
.schedule-time{font-size:15px;font-weight:700;min-width:48px}.schedule-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
</style>
https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2

<script>
const supabase = window.supabase.createClient(
  "https://wxvowdcvkhltbooeudci.supabase.co",
  "sb_publishable_RgoHZbieMvYVY21y-66LsA_PI6pe79M"
);
</script>
</head>
<body>
<header><h1>🎷 Sax Setlist</h1><div class="sub">サックスアンサンブル用・演奏会セットリスト</div></header>
<main>
<div class="tabs">
<button id="tEvents" class="active" onclick="tab('events')">演奏会</button>
<button id="tSet" onclick="tab('set')">セットリスト</button>
<button id="tSongs" onclick="tab('songs')">曲ライブラリ</button>
<button id="tSchedule" onclick="tab('schedule')">進行表</button>
</div>
<section id="events"></section><section id="set" class="hidden"></section>
<section id="songs" class="hidden"></section><section id="schedule" class="hidden"></section>
</main>
<div class="bottom">
<button onclick="openEvent()">＋ 演奏会</button><button class="secondary" onclick="openSong()">＋ 曲を登録</button>
</div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>

<script>
const K='sax_setlist_v2';
let db=JSON.parse(localStorage.getItem(K)||'null')||{
 songs:[
 {id:1,name:'宝島',sec:270,ensemble:'S / A / T / B'},
 {id:2,name:'アメリカン・サリュート',sec:240,ensemble:'S / A / T / B'},
 {id:3,name:'スーパーマリオブラザーズ',sec:220,ensemble:'S / A / T / B'},
 {id:4,name:'ジャパニーズ・グラフィティ VI',sec:380,ensemble:'S / A / T / B'}
 ],
 events:[{id:1,name:'2026 熊本地震チャリティーコンサート',start:'14:00',items:[
  {id:11,type:'song',songId:3},{id:12,type:'gap',gapType:'MC',sec:90},
  {id:13,type:'song',songId:1},{id:14,type:'gap',gapType:'曲紹介',sec:60},
  {id:15,type:'song',songId:2},{id:16,type:'gap',gapType:'楽器持ち替え',sec:30},
  {id:17,type:'song',songId:4}
 ]}]
};
let current=db.events[0]?.id||null;
function save(){localStorage.setItem(K,JSON.stringify(db));saveCloud();}
  async function saveCloud() {

  const { error } = await supabase
    .from('setlists')
    .upsert([
      {
        id: '00000000-0000-0000-0000-000000000001',
        name: 'main',
        data: db,
        updated_at: new Date().toISOString()
      }
    ]);

  if(error){
    console.error(error);
    alert('クラウド保存失敗');
  }
}
  async function loadCloud(){

  const { data, error } = await supabase
    .from('setlists')
    .select('*')
    .eq('name','main')
    .single();

  if(data?.data){
    db = data.data;
    render();
  }
}

function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ev(){return db.events.find(e=>e.id===current)||db.events[0]}
function song(id){return db.songs.find(s=>s.id==id)}
function addTime(t,sec){let [h,m]=t.split(':').map(Number),n=(h*60+m)+Math.ceil(sec/60);n%=1440;return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function totals(){let e=ev(),music=0,gap=0;e?.items.forEach(i=>i.type==='song'?music+=song(i.songId)?.sec||0:gap+=i.sec||0);return{music,gap,total:music+gap}}
function tab(x){['events','set','songs','schedule'].forEach(y=>document.getElementById(y).classList.toggle('hidden',x!==y));['tEvents','tSet','tSongs','tSchedule'].forEach((id,i)=>document.getElementById(id).classList.toggle('active',x===['events','set','songs','schedule'][i]));if(x==='set'&&!ev())tab('events')}
function render(){renderEvents();renderSet();renderSongs();renderSchedule()}
function renderEvents(){
 let h=`<div class="card"><div class="row"><b>演奏会</b><button onclick="openEvent()">＋ 新規</button></div>`;
 db.events.forEach(e=>h+=`<div class="item" style="cursor:pointer" onclick="selectEvent(${e.id})"><div class="row"><div><div class="title">${esc(e.name)}</div><div class="muted">開演 ${e.start}　${e.items.filter(i=>i.type==='song').length}曲</div></div><span style="font-size:22px;color:#999">›</span></div></div>`);
 if(!db.events.length)h+=`<div class="empty">演奏会を登録してください。</div>`;h+=`</div>`;document.getElementById('events').innerHTML=h
}
function selectEvent(id){current=id;tab('set');render()}
function renderSet(){
 let e=ev();if(!e){document.getElementById('set').innerHTML='';return}
 let t=totals(),h=`<div class="card"><div class="row"><b>${esc(e.name)}</b><button class="secondary" onclick="editEvent()">編集</button></div><label>開演時刻</label><input type="time" value="${e.start}" onchange="e.start=this.value;save();render()"></div>`;
 h+=`<div class="card"><div class="row"><b>セットリスト</b><button onclick="openAddMenu()">＋ 追加</button></div>`;
 if(!e.items.length)h+=`<div class="empty">曲を追加してください。</div>`;
 e.items.forEach((it,i)=>{
  if(it.type==='song'){let s=song(it.songId);h+=`<div class="item" draggable="true" ondragstart="drag=${i}" ondragover="event.preventDefault()" ondrop="drop(${i})"><div class="row"><div style="display:flex;align-items:center"><span class="grab">☰</span><div><div class="title">${i+1}. ${esc(s?.name)}</div><div class="muted">${fmt(s?.sec||0)}${s?.ensemble?` <span class="badge">${esc(s.ensemble)}</span>`:''}</div></div></div><button class="secondary" onclick="editSongItem(${it.id})">編集</button></div></div>`}
  else h+=`<div class="gap" draggable="true" ondragstart="drag=${i}" ondragover="event.preventDefault()" ondrop="drop(${i})">↓ ${esc(it.gapType)}　${fmt(it.sec)} <button class="secondary" style="float:right;padding:5px 8px" onclick="editGap(${it.id})">編集</button><div style="clear:both"></div></div>`
 });
 h+=`</div><div class="card"><div class="row"><span>演奏時間</span><span>${fmt(t.music)}</span></div><div class="row"><span>曲間・進行</span><span>${fmt(t.gap)}</span></div><hr><div class="row"><span class="total">合計</span><span class="total">${fmt(t.total)}</span></div><div class="end">終演予定　${addTime(e.start,t.total)}</div></div>`;
 document.getElementById('set').innerHTML=h
}
let drag=null;function drop(to){if(drag===null||drag===to)return;let e=ev(),a=e.items.splice(drag,1)[0];e.items.splice(to,0,a);drag=null;save();render()}
function renderSongs(){
 let h=`<div class="card"><div class="row"><b>曲ライブラリ</b><button onclick="openSong()">＋ 曲を追加</button></div>`;
 db.songs.forEach(s=>h+=`<div class="item"><div class="row"><div><div class="title">${esc(s.name)}</div><div class="muted">${fmt(s.sec)}　${esc(s.ensemble||'')}</div></div><button class="secondary" onclick="editSong(${s.id})">編集</button></div></div>`);
 h+=`</div>`;document.getElementById('songs').innerHTML=h
}
function renderSchedule(){
 let e=ev();if(!e){document.getElementById('schedule').innerHTML='';return}
 let cur=e.start,h=`<div class="card"><div class="row"><b>${esc(e.name)}</b><span class="muted">進行表</span></div>`;
 e.items.forEach((it,i)=>{if(it.type==='song'){let s=song(it.songId),st=cur;h+=`<div class="schedule-item"><b class="schedule-time">${st}</b><div><div class="title">${i+1}. ${esc(s?.name)}</div><div class="muted">${fmt(s?.sec||0)}</div></div></div>`;cur=addTime(cur,s?.sec||0)}
 else {h+=`<div class="schedule-item"><b class="schedule-time">↓</b><div><div class="title">${esc(it.gapType)}</div><div class="muted">${fmt(it.sec)}</div></div></div>`;cur=addTime(cur,it.sec)}})
 h+=`<div class="item"><b>${cur}</b>　終演予定</div></div>`;document.getElementById('schedule').innerHTML=h
}
function modal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function close(){document.getElementById('modal').classList.remove('show')}
function openEvent(){modal(`<h2>演奏会を登録</h2><label>演奏会名</label><input id="en" placeholder="例：2026 熊本地震チャリティーコンサート"><label>開演時刻</label><input id="et" type="time" value="14:00"><div class="actions"><button class="secondary" onclick="close()">キャンセル</button><button onclick="addEvent()">登録</button></div>`)}
function addEvent(){let name=document.getElementById('en').value.trim();if(!name)return alert('演奏会名を入力してください');let e={id:Date.now(),name,start:document.getElementById('et').value,items:[]};db.events.push(e);current=e.id;save();close();render();tab('set')}
function editEvent(){let e=ev();modal(`<h2>演奏会を編集</h2><label>演奏会名</label><input id="en" value="${esc(e.name)}"><label>開演時刻</label><input id="et" type="time" value="${e.start}"><div class="actions"><button class="danger" onclick="deleteEvent()">削除</button><button onclick="updateEvent()">保存</button></div>`)}
function updateEvent(){let e=ev();e.name=document.getElementById('en').value.trim();e.start=document.getElementById('et').value;save();close();render()}
function deleteEvent(){if(db.events.length===1)return alert('最後の演奏会は削除できません');if(!confirm('この演奏会を削除しますか？'))return;db.events=db.events.filter(x=>x.id!==current);current=db.events[0].id;save();close();render();tab('events')}
function openSong(){modal(`<h2>曲を登録</h2><label>曲名</label><input id="sn"><label>演奏時間</label><div class="row"><input id="sm" type="number" min="0" value="4"><input id="ss" type="number" min="0" max="59" value="0"></div><label>編成（任意）</label><input id="se" placeholder="例：S / A / T / B / Cajon"><div class="actions"><button class="secondary" onclick="close()">キャンセル</button><button onclick="addSong()">登録</button></div>`)}
function addSong(){let n=document.getElementById('sn').value.trim(),sec=+document.getElementById('sm').value*60+(+document.getElementById('ss').value||0);if(!n)return alert('曲名を入力してください');db.songs.push({id:Date.now(),name:n,sec,ensemble:document.getElementById('se').value.trim()});save();close();render();tab('songs')}
function editSong(id){let s=song(id);modal(`<h2>曲を編集</h2><label>曲名</label><input id="sn" value="${esc(s.name)}"><label>演奏時間</label><div class="row"><input id="sm" type="number" value="${Math.floor(s.sec/60)}"><input id="ss" type="number" value="${s.sec%60}"></div><label>編成</label><input id="se" value="${esc(s.ensemble||'')}"><div class="actions"><button class="danger" onclick="deleteSong(${id})">削除</button><button onclick="updateSong(${id})">保存</button></div>`)}
function updateSong(id){let s=song(id);s.name=document.getElementById('sn').value.trim();s.sec=+document.getElementById('sm').value*60+(+document.getElementById('ss').value||0);s.ensemble=document.getElementById('se').value.trim();save();close();render()}
function deleteSong(id){if(!confirm('曲を削除しますか？セットリストからも削除されます。'))return;db.songs=db.songs.filter(s=>s.id!=id);db.events.forEach(e=>e.items=e.items.filter(i=>i.type!=='song'||i.songId!=id));save();close();render()}
function openAddMenu(){let opts=db.songs.map(s=>`<option value="${s.id}">${esc(s.name)} (${fmt(s.sec)})</option>`).join('');modal(`<h2>セットリストに追加</h2><button onclick="addSongItem()" style="width:100%;margin-bottom:8px">🎵 曲を追加</button><button class="secondary" onclick="openGap()" style="width:100%">⏱ 曲間・進行を追加</button><label style="margin-top:15px">曲を選ぶ場合</label><select id="asi">${opts}</select>`)}
function addSongItem(){let sid=+document.getElementById('asi').value;ev().items.push({id:Date.now(),type:'song',songId:sid});save();close();render();tab('set')}
function openGap(){modal(`<h2>曲間・進行を追加</h2><label>種類</label><select id="gt"><option>MC</option><option>曲紹介</option><option>楽器持ち替え</option><option>譜面交換</option><option>準備</option><option>演出</option><option>その他</option></select><label>時間</label><div class="row"><input id="gm" type="number" value="1" min="0"><input id="gs" type="number" value="0" min="0" max="59"></div><div class="actions"><button class="secondary" onclick="close()">キャンセル</button><button onclick="addGap()">追加</button></div>`)}
function addGap(){let sec=+document.getElementById('gm').value*60+(+document.getElementById('gs').value||0);ev().items.push({id:Date.now(),type:'gap',gapType:document.getElementById('gt').value,sec});save();close();render();tab('set')}
function editGap(id){let i=ev().items.find(x=>x.id===id);modal(`<h2>曲間・進行を編集</h2><label>種類</label><select id="gt">${['MC','曲紹介','楽器持ち替え','譜面交換','準備','演出','その他'].map(x=>`<option ${x===i.gapType?'selected':''}>${x}</option>`).join('')}</select><label>時間</label><div class="row"><input id="gm" type="number" value="${Math.floor(i.sec/60)}"><input id="gs" type="number" value="${i.sec%60}"></div><div class="actions"><button class="danger" onclick="removeItem(${id})">削除</button><button onclick="updateGap(${id})">保存</button></div>`)}
function updateGap(id){let i=ev().items.find(x=>x.id===id);i.gapType=document.getElementById('gt').value;i.sec=+document.getElementById('gm').value*60+(+document.getElementById('gs').value||0);save();close();render()}
function removeItem(id){ev().items=ev().items.filter(i=>i.id!==id);save();close();render()}
function editSongItem(id){let i=ev().items.find(x=>x.id===id),opts=db.songs.map(s=>`<option value="${s.id}" ${s.id==i.songId?'selected':''}>${esc(s.name)} (${fmt(s.sec)})</option>`).join('');modal(`<h2>曲を編集</h2><label>曲</label><select id="esi">${opts}</select><div class="actions"><button class="danger" onclick="removeItem(${id})">削除</button><button onclick="updateSongItem(${id})">保存</button></div>`)}
function updateSongItem(id){ev().items.find(i=>i.id===id).songId=+document.getElementById('esi').value;save();close();render()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
render(); loadCloud();
</script>
</body></html>

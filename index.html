<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sax Setlist</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#fff;padding:17px 16px 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;color:#777}main{max-width:720px;margin:auto;padding:14px 14px 88px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
button{border:0;border-radius:10px;padding:10px 13px;font-size:14px;background:#222;color:#fff}
button.secondary{background:#e9e9ec;color:#222}button.danger{background:#fff0f0;color:#c22}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#777;font-size:13px}
label{display:block;font-size:12px;color:#666;margin:9px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:16px;background:#fff}
.item{padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.title{font-weight:600}.time{font-variant-numeric:tabular-nums;color:#555}.grab{font-size:20px;color:#999;padding-right:8px;cursor:grab}
.gap{margin:6px 0 2px 30px;padding:8px 10px;background:#f2f2f4;border-radius:9px;font-size:13px}
.total{font-size:20px;font-weight:700}.end{font-size:14px;color:#555}
.empty{text-align:center;color:#888;padding:28px 8px}.hidden{display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:9px;display:flex;gap:8px;z-index:10}.bottom button{flex:1}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}
.badge{font-size:11px;background:#eee;padding:3px 7px;border-radius:99px;margin-left:5px}
.schedule-time{font-size:15px;font-weight:700;min-width:48px}.schedule-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.print-schedule .schedule-item{
  padding:4px 0;
  gap:8px;
  align-items:center;
}

.print-schedule .schedule-time{
  min-width:50px;
  font-size:13px;
}

.print-schedule .title{
  font-size:15px;
  line-height:1.2;
  font-weight:500;
}
  .time-picker{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:8px;
}

.time-picker select{
  font-size:22px;
  padding:14px;
  text-align:center;
}

.time-display-button{
  width:100%;
  font-size:22px;
  padding:14px;
  border-radius:12px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  "https://wxvowdcvkhltbooeudci.supabase.co",
  "sb_publishable_RgoHZbieMvYVY21y-66LsA_PI6pe79M"
);
</script>

</head>

<body>
<header>
  <div class="row">
    <div>
      <h1>🎷 Sax Setlist</h1>
      <div class="sub">サックスアンサンブル用・演奏会セットリスト</div>
    </div>

    <button
      class="secondary"
      onclick="loadCloud()">
      🔄同期
    </button>
  </div>
</header>
<main>
<div class="tabs">
<button id="tEvents" class="active" onclick="tab('events')">演奏会</button>
<button id="tSet" onclick="tab('set')">セットリスト</button>
<button id="tSongs" onclick="tab('songs')">曲ライブラリ</button>
<button id="tSchedule" onclick="tab('schedule')">進行表</button>
</div>
<section id="events"></section><section id="set" class="hidden"></section>
<section id="songs" class="hidden"></section><section id="schedule" class="hidden"></section>
</main>
<div class="bottom">
<button onclick="openEvent()">＋ 演奏会</button><button class="secondary" onclick="openSong()">＋ 曲を登録</button>
</div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>

<script>
const K='sax_setlist_v2';
let db=JSON.parse(localStorage.getItem(K)||'null')||{
 songs:[
 {id:1,name:'宝島',sec:270,ensemble:'S / A / T / B'},
 {id:2,name:'アメリカン・サリュート',sec:240,ensemble:'S / A / T / B'},
 {id:3,name:'スーパーマリオブラザーズ',sec:220,ensemble:'S / A / T / B'},
 {id:4,name:'ジャパニーズ・グラフィティ VI',sec:380,ensemble:'S / A / T / B'}
 ],
 events:[{id:1,name:'2026 熊本地震チャリティーコンサート',start:'14:00',mcSec:60,
items:[
  {id:11,type:'song',songId:3},
  {id:13,type:'song',songId:1},
  {id:15,type:'song',songId:2},
  {id:17,type:'song',songId:4}
]
         }]
};

  normalizeData();
  
let current=db.events[0]?.id||null;
function save(){localStorage.setItem(K,JSON.stringify(db));saveCloud();}
async function saveCloud() {

  const { error } = await supabaseClient
    .from('setlists')
    .upsert([
      {
        id: '00000000-0000-0000-0000-000000000001',
        name: 'main',
        data: JSON.stringify(db),
        updated_at: new Date().toISOString()
      }
    ]);

  if(error){
    console.error(error);
  }
}

async function loadCloud(){

  const { data, error } = await supabaseClient
    .from('setlists')
    .select('*')
    .eq('id','00000000-0000-0000-0000-000000000001')
    .single();

  if(error){
    console.error(error);
    return;
  }

if(data?.data){
  db = typeof data.data === 'string'
    ? JSON.parse(data.data)
    : data.data;
normalizeData();
  current = db.events?.[0]?.id || null;
  render();

  const btn = document.querySelector('header button');
  const original = btn.textContent;

  btn.textContent = '✅同期完了';

  setTimeout(() => {
    btn.textContent = original;
  }, 1500);
}
}
function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ev(){return db.events.find(e=>e.id===current)||db.events[0]}
function song(id){return db.songs.find(s=>s.id==id)}
function addTime(t,sec){let [h,m]=t.split(':').map(Number),n=(h*60+m)+Math.ceil(sec/60);n%=1440;return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function normalizeData(){
  db.events.forEach(e=>{
    if(e.mcSec == null){
      e.mcSec = 60;
    }

    e.items = e.items.filter(i=>i.type==='song');
  });
  const ENSEMBLES = [
  'S / A / T / B / Cajon',
  'A / A / T / B / Cajon',
  'S / A / T / B',
  'A / A / T / B'
];

db.songs.forEach(s => {
  if (!ENSEMBLES.includes(s.ensemble)) {
    s.ensemble = 'S / A / T / B';
  }
});
}
  
  function totals(){

  let e=ev();

  if(!e){
    return {music:0,gap:0,total:0,mcCount:0};
  }

  const songs=e.items.filter(i=>i.type==='song');

  let music=0;

  songs.forEach(i=>{
    music += song(i.songId)?.sec || 0;
  });

  const mcCount = Math.max(0, songs.length - 1);

  const gap = mcCount * (e.mcSec || 0);

  return {
    music,
    gap,
    total: music + gap,
    mcCount
  };
}
function tab(x){['events','set','songs','schedule'].forEach(y=>document.getElementById(y).classList.toggle('hidden',x!==y));['tEvents','tSet','tSongs','tSchedule'].forEach((id,i)=>document.getElementById(id).classList.toggle('active',x===['events','set','songs','schedule'][i]));if(x==='set'&&!ev())tab('events')}
function render(){renderEvents();renderSet();renderSongs();renderSchedule()}
function renderEvents(){
 let h=`<div class="card"><div class="row"><b>演奏会一覧</b></div>`;
 db.events.forEach(e=>h+=`<div class="item" style="cursor:pointer" onclick="selectEvent(${e.id})"><div class="row"><div><div class="title">${esc(e.name)}</div><div class="muted">開演 ${e.start}　${e.items.filter(i=>i.type==='song').length}曲</div></div><span style="font-size:22px;color:#999">›</span></div></div>`);
 if(!db.events.length)h+=`<div class="empty">演奏会を登録してください。</div>`;h+=`</div>`;document.getElementById('events').innerHTML=h
}
function selectEvent(id){current=id;tab('set');render()}
function updateStartTime(value){
  if(!value) return;

  const eventData = ev();

  if(!eventData) return;

  if(eventData.start === value) return;

  eventData.start = value;

  save();
  render();
}

  function openStartTimePicker(){
  const eventData = ev();

  if(!eventData) return;

  let [hour, minute] = eventData.start.split(':');

  let hourOptions = '';
  for(let h = 0; h < 24; h++){
    const v = String(h).padStart(2, '0');
    hourOptions += `<option value="${v}" ${v === hour ? 'selected' : ''}>${v}時</option>`;
  }

  let minuteOptions = '';
  for(let m = 0; m < 60; m += 5){
    const v = String(m).padStart(2, '0');
    minuteOptions += `<option value="${v}" ${v === minute ? 'selected' : ''}>${v}分</option>`;
  }

  modal(`
    ${modalTitle('開演時刻を設定')}

    <div class="time-picker">
      <div>
        <label>時</label>
        <select id="startHour">
          ${hourOptions}
        </select>
      </div>

      <div>
        <label>分</label>
        <select id="startMinute">
          ${minuteOptions}
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="secondary" onclick="modalClose()">キャンセル</button>
      <button onclick="setStartTime()">設定</button>
    </div>
  `);
}

function setStartTime(){
  const h = document.getElementById('startHour').value;
  const m = document.getElementById('startMinute').value;

  updateStartTime(`${h}:${m}`);

  modalClose();
}
  
  function renderSet(){
 let e=ev();if(!e){document.getElementById('set').innerHTML='';return}
 let t=totals(),h=`<div class="card"><div class="row"><b>${esc(e.name)}</b><button class="secondary" onclick="editEvent()">編集</button></div>
 <label>開演時刻</label>
 <button class="secondary time-display-button" onclick="openStartTimePicker()">
  ${esc(e.start)}
</button>
 <label>MC時間（1回あたり）</label>
 <div class="muted">${fmt(e.mcSec || 0)}</div>
 </div>`;
 h+=`<div class="card"><div class="row"><b>セットリスト</b><button onclick="openAddMenu()">＋ 追加</button></div>`;
 if(!e.items.length)h+=`<div class="empty">曲を追加してください。</div>`;
  let songNo = 0;
 e.items.forEach((it,i)=>{
  if(it.type==='song'){
    songNo++;
    let s=song(it.songId);h+=`<div class="item" draggable="true" ondragstart="drag=${i}" ondragover="event.preventDefault()" ondrop="drop(${i})"><div class="row"><div style="display:flex;align-items:center"><span class="grab">☰</span><div><div class="title">${songNo}. ${esc(s?.name)}</div><div class="muted">${fmt(s?.sec||0)}${s?.ensemble?` <span class="badge">${esc(s.ensemble)}</span>`:''}</div></div></div><button class="secondary" onclick="editSongItem(${it.id})">編集</button></div></div>`}
 });
 h+=`</div><div class="card"><div class="row"><span>演奏時間</span><span>${fmt(t.music)}</span></div>

 <div class="row">
    <span>
      MC (${t.mcCount}回 × ${fmt(e.mcSec||0)})
    </span>
    <span>${fmt(t.gap)}</span>
</div>
 <hr><div class="row"><span class="total">合計</span><span class="total">${fmt(t.total)}</span></div><div class="end">終演予定　${addTime(e.start,t.total)}</div></div>`;
 document.getElementById('set').innerHTML=h
}
let drag=null;function drop(to){if(drag===null||drag===to)return;let e=ev(),a=e.items.splice(drag,1)[0];e.items.splice(to,0,a);drag=null;save();render()}
function renderSongs(){
 let h=`<div class="card"><div class="row"><b>曲ライブラリ</b><button onclick="openSong()">＋ 曲を追加</button></div>`;
 db.songs.forEach(s=>h+=`<div class="item"><div class="row"><div><div class="title">${esc(s.name)}</div><div class="muted">${fmt(s.sec)}　${esc(s.ensemble||'')}</div></div><button class="secondary" onclick="editSong(${s.id})">編集</button></div></div>`);
 h+=`</div>`;document.getElementById('songs').innerHTML=h
}
function renderSchedule(){
  let e=ev();

  if(!e){
    document.getElementById('schedule').innerHTML='';
    return;
  }

  let songs = e.items.filter(i=>i.type==='song');
  let songNo = 0;

  // 開演時刻からの経過秒数
  let curSec = 0;

  let h=`<div class="card print-schedule">
    <div class="row">
      <b>${esc(e.name)}</b>
      <span class="muted">進行表</span>
    </div>`;

  songs.forEach((it,index)=>{
    songNo++;

    let s=song(it.songId);

    // 表示するときだけ、開演時刻 + 経過秒数 で計算
    let st=addTime(e.start, curSec);

    h+=`<div class="schedule-item">
      <b class="schedule-time">${st}</b>
      <div class="title">
        ${songNo}. ${esc(s?.name)}
        <span style="color:#666">
          （${fmt(s?.sec||0)}）
        </span>
      </div>
    </div>`;

    // 曲の秒数をそのまま加算
    curSec += s?.sec || 0;

    // 最後の曲以外はMC時間を秒数のまま加算
    if(index < songs.length - 1){
      curSec += e.mcSec || 0;
    }
  });

  h+=`<div class="item"><b>${addTime(e.start, curSec)}</b>　終演予定</div></div>`;

  document.getElementById('schedule').innerHTML=h;
}

function openAddMenu(){
  let opts=db.songs.map(s=>
    `<option value="${s.id}">${esc(s.name)} (${fmt(s.sec)})</option>`
  ).join('');

  modal(`
    <h2>セットリストに追加</h2>

    <label>追加する曲</label>
    <select id="asi">${opts}</select>

    <div class="actions">
      <button onclick="addSongItem()">🎵 曲を追加</button>
    </div>
  `)
}
  function modalTitle(title){
  return `
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0">${title}</h2>

      <button
        type="button"
        onclick="modalClose()"
        style="
          background:none;
          color:#666;
          font-size:24px;
          padding:0;
          width:32px;
          height:32px;
        ">
        ✕
      </button>
    </div>
  `;
}
function modal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
  
function modalClose(){document.getElementById('modal').classList.remove('show')}
function timeSelectHtml(value, prefix){
  let [hour, minute] = (value || '14:00').split(':');

  let hourOptions = '';
  for(let h = 0; h < 24; h++){
    const v = String(h).padStart(2, '0');
    hourOptions += `<option value="${v}" ${v === hour ? 'selected' : ''}>${v}時</option>`;
  }

  let minuteOptions = '';
  for(let m = 0; m < 60; m++){
    const v = String(m).padStart(2, '0');
    minuteOptions += `<option value="${v}" ${v === minute ? 'selected' : ''}>${v}分</option>`;
  }

  return `
    <div class="time-picker">
      <div>
        <label>時</label>
        <select id="${prefix}Hour">
          ${hourOptions}
        </select>
      </div>

      <div>
        <label>分</label>
        <select id="${prefix}Minute">
          ${minuteOptions}
        </select>
      </div>
    </div>
  `;
}

function getTimeValue(prefix){
  const h = document.getElementById(`${prefix}Hour`).value;
  const m = document.getElementById(`${prefix}Minute`).value;

  return `${h}:${m}`;
}
function openEvent(){
  modal(`${modalTitle('演奏会を登録')}
    <label>演奏会名</label>
    <input id="en" placeholder="例：2026 熊本地震チャリティーコンサート">

    <label>開演時刻</label>
    ${timeSelectHtml('14:00', 'et')}

    <label>MC時間（1回あたり）</label>
    <div class="row">
      <input id="emcm" type="number" min="0" value="1">
      <input id="emcs" type="number" min="0" max="59" value="0">
    </div>

    <div class="actions">
      <button onclick="addEvent()">登録</button>
    </div>
  `)
}
function addEvent(){
  let name=document.getElementById('en').value.trim();

  if(!name){
    return alert('演奏会名を入力してください');
  }

  let mcSec =
    +document.getElementById('emcm').value * 60 +
    (+document.getElementById('emcs').value || 0);

  let e={
    id:Date.now(),
    name,
    start:getTimeValue('et'),
    mcSec,
    items:[]
  };

  db.events.push(e);
  current=e.id;
  save();
  modalClose();
  render();
  tab('set');
}
function editEvent(){
  let e=ev();

  modal(`${modalTitle('演奏会を編集')}
    <label>演奏会名</label>
    <input id="en" value="${esc(e.name)}">

    <label>開演時刻</label>
    ${timeSelectHtml(e.start, 'et')}

    <label>MC時間（1回あたり）</label>
    <div class="row">
      <input id="emcm" type="number" min="0" value="${Math.floor((e.mcSec||0)/60)}">
      <input id="emcs" type="number" min="0" max="59" value="${(e.mcSec||0)%60}">
    </div>

    <div class="actions">
      <button class="danger" onclick="deleteEvent()">削除</button>
      <button onclick="updateEvent()">保存</button>
    </div>
  `)
}

function updateEvent(){
  let e=ev();

  e.name=document.getElementById('en').value.trim();
  e.start=getTimeValue('et');

  e.mcSec =
    +document.getElementById('emcm').value * 60 +
    (+document.getElementById('emcs').value || 0);

  save();
  modalClose();
  render();
}
  function deleteEvent(){if(db.events.length===1)return alert('最後の演奏会は削除できません');if(!confirm('この演奏会を削除しますか？'))return;db.events=db.events.filter(x=>x.id!==current);current=db.events[0].id;save();modalClose();render();tab('events')}
function openSong(){
  modal(`
    ${modalTitle('曲を登録')}

    <label>曲名</label>
    <input id="sn">

    <label>演奏時間</label>
    <div class="row">
      <input id="sm" type="number" min="0" value="4">
      <input id="ss" type="number" min="0" max="59" value="0">
    </div>

    <label>編成</label>
    <select id="se">
      <option value="S / A / T / B / Cajon">S / A / T / B / Cajon</option>
      <option value="A / A / T / B / Cajon">A / A / T / B / Cajon</option>
      <option value="S / A / T / B">S / A / T / B</option>
      <option value="A / A / T / B">A / A / T / B</option>
    </select>

    <div class="actions">
      <button onclick="addSong()">登録</button>
    </div>
  `)
}
  function addSong(){let n=document.getElementById('sn').value.trim(),sec=+document.getElementById('sm').value*60+(+document.getElementById('ss').value||0);if(!n)return alert('曲名を入力してください');db.songs.push({id:Date.now(),name:n,sec,ensemble:document.getElementById('se').value.trim()});save();modalClose();render();tab('songs')}
function editSong(id){
  let s = song(id);

  modal(`
    ${modalTitle('曲を編集')}

    <label>曲名</label>
    <input id="sn" value="${esc(s.name)}">

    <label>演奏時間</label>
    <div class="row">
      <input id="sm" type="number" value="${Math.floor(s.sec/60)}">
      <input id="ss" type="number" value="${s.sec%60}">
    </div>

    <label>編成</label>
    <select id="se">
      <option value="S / A / T / B / Cajon" ${s.ensemble==="S / A / T / B / Cajon" ? "selected" : ""}>
        S / A / T / B / Cajon
      </option>
      <option value="A / A / T / B / Cajon" ${s.ensemble==="A / A / T / B / Cajon" ? "selected" : ""}>
        A / A / T / B / Cajon
      </option>
      <option value="S / A / T / B" ${s.ensemble==="S / A / T / B" ? "selected" : ""}>
        S / A / T / B
      </option>
      <option value="A / A / T / B" ${s.ensemble==="A / A / T / B" ? "selected" : ""}>
        A / A / T / B
      </option>
    </select>

    <div class="actions">
      <button class="danger" onclick="deleteSong(${id})">削除</button>
      <button onclick="updateSong(${id})">保存</button>
    </div>
  `)
}
  function updateSong(id){let s=song(id);s.name=document.getElementById('sn').value.trim();s.sec=+document.getElementById('sm').value*60+(+document.getElementById('ss').value||0);s.ensemble=document.getElementById('se').value.trim();save();modalClose();render()}
function deleteSong(id){if(!confirm('曲を削除しますか？セットリストからも削除されます。'))return;db.songs=db.songs.filter(s=>s.id!=id);db.events.forEach(e=>e.items=e.items.filter(i=>i.type!=='song'||i.songId!=id));save();modalClose();render()}
function addSongItem(){let sid=+document.getElementById('asi').value;ev().items.push({id:Date.now(),type:'song',songId:sid});save();modalClose();render();tab('set')}
function removeItem(id){ev().items=ev().items.filter(i=>i.id!==id);save();modalClose();render()}
function editSongItem(id){let i=ev().items.find(x=>x.id===id),opts=db.songs.map(s=>`<option value="${s.id}" ${s.id==i.songId?'selected':''}>${esc(s.name)} (${fmt(s.sec)})</option>`).join('');modal(`${modalTitle('曲を編集')}<label>曲</label><select id="esi">${opts}</select><div class="actions"><button class="danger" onclick="removeItem(${id})">削除</button><button onclick="updateSongItem(${id})">保存</button></div>`)}
function updateSongItem(id){ev().items.find(i=>i.id===id).songId=+document.getElementById('esi').value;save();modalClose();render()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')modalClose()});
loadCloud();
//  window.addEventListener('focus', loadCloud);

</script>
